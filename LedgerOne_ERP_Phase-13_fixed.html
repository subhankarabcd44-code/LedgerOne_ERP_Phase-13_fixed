function pkHTML(k){const D=pkData(),P=PK[k],l=P.d.map(x=>x[0][0]==="#"?{t:x[0].slice(1),h:1}:{t:x[0],f:x[1]}),out=[];l.forEach(x=>{if(x.h)out.push(`<div class="pk"><div class="sec">${esc(x.t)}</div></div>`);else out.push(`<div class="pk ${k==="ppt"?"sl":""}">${DOC[x.f](D,l)}</div>`)});return{html:out.join(""),D}}
function pkDl(){const{html,D}=pkHTML(pkK);const b=new Blob([`<html><head><meta charset="utf-8"><title>${PK[pkK].n}</title><style>body{font-family:Segoe UI,Arial}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ccc;padding:4px;text-align:left}.n{text-align:right}.pk{page-break-after:always}.sec{background:#14224f;color:#fff;padding:10px}.kp div{display:inline-block;border:1px solid #ccc;padding:6px;margin:4px}</style></head><body>${html}</body></html>`],{type:"application/msword"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`${PK[pkK].n.replace(/ /g,"_")}_${D.pe}.doc`;a.click()}
function vPkg(){const D=pkData(),{html}=pkHTML(pkK);return`<div class="cd" id="pkbar"><div class="tabs">${Object.keys(PK).map(k=>`<button class="b s ${k===pkK?"on":""}" onclick="pkK='${k}';render()">${PK[k].n}</button>`).join("")}</div><div class="f"><label>Period (CurrentMonth variable)<select onchange="pkP=+this.value;render()">${D.py.map(p=>`<option value="${p.no}" ${p.no===D.p.no?"selected":""}>P${p.no} · ${p.s} → ${p.e}</option>`).join("")}</select></label><label>Fiscal year<select onchange="pfy=+this.value;pkP=1;render()">${[...new Set(D.c.per.map(p=>p.y))].map(v=>`<option ${v===D.y?"selected":""}>${v}</option>`).join("")}</select></label><button class="b" onclick="pkDl()">Download Word (.doc)</button><button class="b s" onclick="window.print()">Print / Save as PDF</button><button class="b" onclick="pkFS()">${document.body.classList.contains("fsx")?"Exit full screen":"Full screen"}</button></div><p class="mu">Every figure is computed from posted journals. Variables (e.g. NetRevenue_Value, PeriodEnded) refresh when the period changes. Print the PowerPoint package in landscape for slides.</p></div><div id="pkout" class="${pkK}">${html}</div>`}

function pkFS(){const b=document.body,on=!b.classList.contains("fsx");b.classList.toggle("fsx",on);if(on){try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}else{try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}}render()}
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&document.body.classList.contains("fsx")){document.body.classList.remove("fsx");render()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("fsx")&&!document.fullscreenElement){document.body.classList.remove("fsx");render()}});

 $("#top").innerHTML=`<input placeholder="Search journals…" value="${esc(q)}" onchange="q=this.value;view='gl';render()"><span class="sp"></span><span class="mu">Approvals: <b>${c.je.filter(j=>j.st==="SUBMITTED").length}</b></span><span class="mu">Period: ${cp?`FY${cp.y} P${cp.no} ${tag(cp.st)}`:"—"}</span><select onchange="S.cur=this.value;pfy=0;tbF=tbT='';save();render()">${opt(Object.values(S.cos),S.cur,x=>[x.code,x.code+" · "+x.name])}</select><select onchange="S.role=this.value;save();render()" title="Switch role to test permissions">${opt(Object.keys(ROLES),S.role)}</select>`;
 $("#mn").innerHTML=`<h2>${{dash:"Dashboard",ap:"Accounts Payable",ar:"Accounts Receivable",bud:"Budget control",proc:"Procurement",fa:"Fixed Assets",gl:"General Ledger",rep:"Reports",coa:"Chart of Accounts",adm:"Administration",bank:"Bank & Cash",cc:"Cost Centers",wbs:"Projects / WBS",io:"Internal Orders",rev:"Revenue",exp:"Expenses",tax:"Tax",fs:"Financial Statements",pkg:"Report Packages"}[view]}</h2>`+{dash:vDash,ap:()=>vSub("AP"),ar:()=>vSub("AR"),bud:vBud,proc:vProc,fa:vFA,gl:vGL,rep:vRep,coa:vCoa,adm:vAdm,bank:vBank,cc:vCC,wbs:()=>vOb("WBS"),io:()=>vOb("IO"),rev:()=>vRE("R"),exp:()=>vRE("X"),tax:vTax,fs:vFS,pkg:vPkg}[view]()}
